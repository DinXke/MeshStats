services:
  meshstats:
    build: ./server
    image: meshstats:latest
    container_name: meshstats
    restart: unless-stopped
    ports:
      - "${MESHSTATS_PORT:-8080}:8080"
    environment:
      # Weergave en bewaartermijn (ook aanpasbaar via /admin)
      MCS_SITE_NAME: "${MCS_SITE_NAME:-MeshCore Repeater Stats}"
      MCS_RETENTION_DAYS: "${MCS_RETENTION_DAYS:-180}"
      MCS_HEARTBEAT_MIN: "${MCS_HEARTBEAT_MIN:-5}"
      # Beveiliging: bodylimiet en het aantal proxies vóór de app (zie .env.example)
      MCS_MAX_BODY_BYTES: "${MCS_MAX_BODY_BYTES:-2000000}"
      MCS_TRUSTED_PROXY_HOPS: "${MCS_TRUSTED_PROXY_HOPS:-1}"
      # MQTT: nodes publiceren hun statistieken naar de broker hieronder
      MCS_MQTT_HOST: "${MCS_MQTT_HOST:-mosquitto}"
      MCS_MQTT_PORT: "${MCS_MQTT_PORT:-1883}"
      MCS_MQTT_USER: "${MCS_MQTT_USER:-meshstats}"
      MCS_MQTT_PASS: "${MCS_MQTT_PASS:-}"
      MCS_MQTT_TOPIC: "${MCS_MQTT_TOPIC:-meshcore/+/stats}"
      MCS_MQTT_RX_TOPIC: "${MCS_MQTT_RX_TOPIC:-meshcore/+/rx}"
      # Tijdreeksen: leeg laten om alles in SQLite te houden
      MCS_TSDB_URL: "${MCS_TSDB_URL:-http://victoria:8428}"
    volumes:
      - meshstats-data:/data
    depends_on:
      - mosquitto
      - victoria

  # Tijdreeksdatabank voor de metingen. SQLite blijft de rest doen (repeaters,
  # actuele waarden, contacten, pakketten, beheer); alleen de historiek gaat
  # hierheen. De compressie van VictoriaMetrics zit rond een byte per meetpunt,
  # waardoor volledige resolutie bewaren goedkoper is dan uitdunnen in SQLite.
  victoria:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: meshstats-tsdb
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${MCS_TSDB_RETENTION:-180d}"
      # Zonder rem eist VictoriaMetrics een groot deel van het werkgeheugen op en
      # verdringt hij de site. Een percentage in plaats van een vast getal, zodat
      # dit meeschaalt als de machine groter wordt: 128 MB bij 512 MB, 512 MB bij
      # 2 GB. Meer cache maakt lange bereikvragen sneller, maar de dataset is
      # klein en de site heeft voorrang.
      - "-memory.allowedPercent=25"
      - "-search.maxQueryDuration=30s"
      - "-httpListenAddr=:8428"
    volumes:
      - victoria-data:/victoria-metrics-data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: meshstats-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  meshstats-data:
  mosquitto-data:
  mosquitto-log:
  victoria-data:
