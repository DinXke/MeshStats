[project]
name = "meshtrack"
version = "0.2.0"
description = "APRS-achtige tracking over MeshCore: openHop-companion -> kaart"
requires-python = ">=3.11"
dependencies = [
  "meshcore>=2.3.15",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "pmtiles>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["meshtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
