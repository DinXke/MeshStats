; Build environments used by the release workflow (.github/workflows/firmware-release.yml).
;
; This file is the counterpart of platformio.local.ini.example, and the two
; differ in exactly one way that matters: this one contains no secrets and never
; will, because it is committed. The workflow copies it into the MeshCore
; checkout as platformio.local.ini and builds every [env:...] section below.
;
; A build without WiFi credentials still produces a usable image, and that is a
; property of the firmware rather than a lucky accident. WIFI_SSID, WIFI_PWD and
; ADMIN_PASSWORD are only ever read as DEFAULTS: MeshStatsNet reads its network
; settings from /msnet.json on the data partition (see loadConfig(), which fills
; the compiled-in values in first and then lets the file overwrite them), and
; MeshCore reads the admin password from its own prefs (MyMesh.cpp writes
; ADMIN_PASSWORD only into the defaults block, for a node that has no prefs yet).
; An OTA writes an application partition and leaves the data partition alone, so
; a node that has been configured once keeps its network and its password across
; every image built from this file.
;
; The consequence, and the reason to say it out loud: an image from here is an
; UPGRADE image. Flash it over USB onto a virgin board and you get a node with no
; network and the placeholder password below, which on a roof is a node you have
; to fetch a ladder for. First installs are built from platformio.local.ini with
; real values; releases are built from here.
;
; ADMIN_PASSWORD is a placeholder rather than empty because it is not only a
; value: `#if defined(ADMIN_PASSWORD)` in ESP32Board.cpp is what compiles the
; stock soft-AP updater into the image at all, and that updater is the last
; fallback when everything in this project fails.
;
; ADDING A BOARD. Copy a section, give it a name that identifies the hardware,
; and point `extends` at the right variant from MeshCore's variants/ tree. The
; release workflow derives its build matrix from the section names here, so
; nothing else needs changing -- and the env name is what ends up in the asset
; file name and in MESHSTATS_ENV, which is how the site knows which image belongs
; to which node. Two boards that take the same binary still get their own entry
; if their env names differ, because a node reports the name it was built under
; and nothing else.
;
; MESHSTATS_ENV='"$PIOENV"' is not optional. Without it the image reports an
; empty build environment, and the site refuses to upgrade a node it cannot
; identify rather than guessing -- a wrong image on a repeater on a roof is not
; recoverable over the air.

[env:heltec_v4_repeater_meshstats]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"MeshStats Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"changeme"'
  -D MAX_NEIGHBOURS=50
  ; The FEM amplifier overloads on a strong signal; the nodes this is built for
  ; stand high and with a clear view, and hear more without it.
  -D RADIO_FEM_RXGAIN_DEFAULT=0
  -D MESHSTATS_NET=1
  -D MESHSTATS_ENV='"$PIOENV"'
  ; DISABLE_WIFI_OTA deliberately NOT set: while our module runs it catches
  ; 'start ota' (there is already a web server on port 80), but once it switches
  ; itself off after repeated restarts the stock OTA works again.
  -D WIFI_SSID='""'
  -D WIFI_PWD='""'
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
  knolleary/PubSubClient @ ^2.8
