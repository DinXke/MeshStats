<!doctype html><html lang=nl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>MeshCore node</title><style>
body{margin:0;
  background:#0b0f14;
  color:#d7e2ea;
  font:15px/1.5 system-ui,sans-serif}
main{max-width:640px;
  margin:0 auto;
  padding:1rem 1.2rem 3rem}
h1{font-size:1.4rem;
  margin:1rem 0 .3rem}
h2{font-size:.8rem;
  text-transform:uppercase;
  letter-spacing:.18em;
  color:#35e08c;
  margin:1.8rem 0 .6rem}
.card{background:#121a23;
  border:1px solid #1e2b3a;
  border-radius:10px;
  padding:1rem}
label{display:block;
  margin-bottom:.8rem}
input,select{width:100%;
  margin-top:.25rem;
  padding:.45rem .7rem;
  border-radius:7px;
  border:1px solid #1e2b3a;
  background:#10161e;
  color:#d7e2ea;
  box-sizing:border-box}
button{padding:.45rem .9rem;
  border:none;
  border-radius:7px;
  background:#1d7a4f;
  color:#eafff4;
  cursor:pointer}
button:hover{background:#35e08c;
  color:#06130c}
table{width:100%;
  border-collapse:collapse}
td{padding:.35rem .5rem;
  border-bottom:1px solid #1e2b3a;
  font-family:ui-monospace,monospace;
  font-size:.9rem}
td:first-child{color:#7d8fa0}
.muted{color:#7d8fa0;
  font-size:.85rem}
.row{display:flex;
  gap:.6rem}
.row label{flex:1}
.ck{width:auto;
  margin-right:.4rem}
nav{display:flex;
  gap:.4rem;
  margin:1.2rem 0 0;
  flex-wrap:wrap}
nav button{background:#121a23;
  color:#7d8fa0;
  border:1px solid #1e2b3a}
nav button.on{background:#1d7a4f;
  color:#eafff4;
  border-color:#1d7a4f}
#note{min-height:1.2rem}
.msgs{max-height:17rem;
  overflow-y:auto;
  margin-bottom:.9rem}
.m{padding:.35rem .55rem;
  border-radius:7px;
  margin-bottom:.35rem;
  background:#10161e;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:.92rem}
.mh{display:block;
  font-size:.72rem;
  color:#7d8fa0}
.k0{border-left:3px solid #35e08c}
.k1{border-left:3px solid #4fa8ff}
.k2{border-left:3px solid #7d8fa0;
  opacity:.7}
.ct{padding:.55rem 0;
  border-bottom:1px solid #1e2b3a}
.ct .row{margin-top:.4rem;
  flex-wrap:wrap;
  align-items:center}
.ct input[type=password]{width:9rem;
  margin-top:0}
.inl{display:flex;
  align-items:center;
  margin:0;
  font-size:.85rem;
  white-space:nowrap}
.inl input{width:auto;
  margin:0 .35rem 0 0}
</style></head><body>
<main>
<h1 id=nm>&#128225; MeshCore node</h1><p class=muted id=sub>laden...</p>
<nav id=nav><button data-t=1 class=on>Berichten</button><button data-t=2>Kanalen</button><button data-t=3>Contacten</button><button data-t=4>Instellingen</button></nav><p class=muted id=note></p>
<section id=s1>
<h2>Berichten</h2>
<div class=card><div id=ml class=msgs data-empty=1>laden...</div>
<form id=sf><label>Bestemming<select id=to></select></label><div class=row><input id=stx placeholder='Typ een bericht' maxlength=150 autocomplete=off><button type=submit>Verstuur</button></div>
</form></div>
</section>
<section id=s2 hidden>
<h2>Kanalen</h2>
<div class=card><table id=cl></table>
<form id=cf style='margin-top:1rem'><div class=row><label>Naam<input id=cn maxlength=31 required></label><label>PSK (base64)<input id=cp placeholder='leeg = nieuw kanaal'></label></div><button type=submit>Kanaal toevoegen</button>
</form><p class=muted>Laat de PSK leeg om een nieuw kanaal met een willekeurige sleutel aan te maken. Vul een bestaande PSK in om aan een kanaal deel te nemen.</p></div>
</section>
<section id=s3 hidden>
<h2>Contacten</h2>
<div class=card><div id=kl>laden...</div><button type=button id=more style='margin-top:.8rem' hidden>Meer laden</button></div>
</section>
<section id=s4 hidden>
<h2>Doorsturen via MQTT</h2>
<div class=card>
<form id=f><div class=row><label>Broker<input name=host placeholder='10.0.0.5'></label><label style='max-width:7rem'>Poort<input name=port type=number min=1 max=65535></label></div><div class=row><label>Gebruiker<input name=user></label><label>Wachtwoord<input name=pass type=password placeholder='ongewijzigd'></label></div><div class=row><label>Topicprefix<input name=prefix></label><label style='max-width:9rem'>Interval (s)<input name=interval type=number min=30 max=86400></label></div><label><input class=ck type=checkbox name=enabled>Doorsturen ingeschakeld</label><label><input class=ck type=checkbox name=forward_rx>Ook elk ontvangen pakket doorsturen</label><button type=submit>Opslaan</button> <button type=button id=tst>Nu versturen</button>
</form><table id=st></table></div>
<h2>Live statistieken</h2>
<div class=card><table id=mt><tr><td>laden...</td></tr></table></div>
</section>
<script>
var $=function(s){return document.querySelector(s)};
var TY={0:'onbekend',1:'chat',2:'repeater',3:'room',4:'sensor'};
var tabn=1,seq=0,off=0,pick=null;
function j(r){return r.json()}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function post(u,d){return fetch(u,{method:'POST',body:new URLSearchParams(d)}).then(j)}function note(t){$('#note').textContent=t||''}function rows(o){var h='';for(var k in o){h+='<tr><td>'+k+'</td><td>'+esc(o[k])+'</td></tr>'}return h}function tm(t){if(!t)return'--:--';var d=new Date(t*1000);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}function ago(a){if(a<0)return'nooit gehoord';if(a<60)return a+'s geleden';if(a<3600)return Math.floor(a/60)+'m geleden';if(a<86400)return Math.floor(a/3600)+'u geleden';return Math.floor(a/86400)+'d geleden'}function tab(n){tabn=n;for(var i=1;i<5;i++)$('#s'+i).hidden=(i!=n);var b=$('#nav').children;for(var i=0;i<b.length;i++)b[i].className=(+b[i].dataset.t==n)?'on':'';note('');if(n==2)chans();if(n==3)ctcs(1);if(n==4)cfg()}$('#nav').onclick=function(e){if(e.target.dataset.t)tab(+e.target.dataset.t)};function msgs(){return fetch('/messages.json?since='+seq).then(j).then(function(d){var h='';(d.m||[]).forEach(function(m){if(m.q>seq)seq=m.q;h+='<div class="m k'+m.k+'"><span class=mh>'+esc(m.s)+' \u00b7 '+tm(m.t)+'</span>'+esc(m.x)+'</div>'});if(h){var e=$('#ml');if(e.dataset.empty){e.innerHTML='';delete e.dataset.empty}e.insertAdjacentHTML('beforeend',h);while(e.children.length>40)e.removeChild(e.firstChild);e.scrollTop=e.scrollHeight}if(d.more)return msgs()})}function chans(off,acc){off=off||0;acc=acc||[];return fetch('/channels.json?off='+off).then(j).then(function(d){acc=acc.concat(d.ch||[]);if(d.next>=0)return chans(d.next,acc);var h='',o='';acc.forEach(function(c){h+='<tr><td>'+c.i+'</td><td>'+esc(c.n)+'</td><td style=text-align:right><button data-i='+c.i+'>Verwijder</button></td></tr>';o+='<option value=c'+c.i+'>#'+esc(c.n)+'</option>'});$('#cl').innerHTML=h||'<tr><td class=muted>nog geen kanalen</td></tr>';if(pick)o+='<option value=k'+pick.k+'>@'+esc(pick.n)+'</option>';var t=$('#to'),cur=t.value;t.innerHTML=o;if(cur)t.value=cur})}function ctcs(reset){if(reset){off=0;$('#kl').innerHTML=''}return fetch('/contacts.json?off='+off).then(j).then(function(d){var h='';d.c.forEach(function(c){h+='<div class=ct data-k='+c.k+' data-n="'+esc(c.n)+'"><div><b>'+esc(c.n)+'</b> <span class=muted>'+TY[c.t]+' \u00b7 '+c.k+' \u00b7 '+ago(c.a)+'</span></div><div class=row>'+'<button class=msg>Bericht</button>';if(c.t==2||c.t==3){h+='<label class=inl><input type=checkbox class=pb'+(c.p?' checked':'')+'>doorsturen naar site</label><input type=password class=pw placeholder="'+(c.w?'ongewijzigd':'wachtwoord')+'"><button class=sv>Bewaren</button><button class=li>Inloggen</button>'}h+='</div></div>'});$('#kl').insertAdjacentHTML('beforeend',h);if(!$('#kl').children.length)$('#kl').innerHTML='<p class=muted>nog geen contacten</p>';off=d.next;$('#more').hidden=(d.next<0)})}$('#more').onclick=function(){ctcs(0)};$('#cl').onclick=function(e){var b=e.target.closest('button');if(!b)return;post('/channel/del',{idx:b.dataset.i}).then(function(r){note(r.ok?'Kanaal verwijderd.':'Verwijderen mislukt.');chans()})};$('#cf').onsubmit=function(e){e.preventDefault();post('/channel/add',{name:$('#cn').value,psk:$('#cp').value}).then(function(r){note(r.ok?'Kanaal toegevoegd.':(r.err||'Toevoegen mislukt.'));if(r.ok){$('#cn').value='';$('#cp').value=''}chans()})};$('#kl').onclick=function(e){var b=e.target.closest('button');if(!b)return;var d=b.closest('.ct'),k=d.dataset.k;if(b.className=='msg'){pick={k:k,n:d.dataset.n};chans().then(function(){$('#to').value='k'+k;tab(1)});return}if(b.className=='sv'){post('/contact/save',{key:k,publish:d.querySelector('.pb').checked?1:0,pass:d.querySelector('.pw').value}).then(function(r){note(r.ok?'Bewaard.':(r.err||'Bewaren mislukt.'));if(r.ok)ctcs(1)});return}if(b.className=='li'){post('/contact/login',{key:k}).then(function(r){note(r.ok?'Inlogverzoek verstuurd.':(r.err||'Inloggen mislukt.'))})}};$('#sf').onsubmit=function(e){e.preventDefault();var t=$('#stx').value;if(!t)return;post('/send',{to:$('#to').value,text:t}).then(function(r){if(r.ok){$('#stx').value='';note('');msgs()}else note(r.err||'Versturen mislukt.')})};function cfg(){fetch('/config.json').then(j).then(function(c){$('#nm').innerHTML='&#128225; '+esc(c.name);$('#sub').textContent='Beheer van deze node \u00b7 IP '+c.ip+' \u00b7 id '+c.node;var f=$('#f');for(var k in c.cfg){var e=f[k];if(!e)continue;if(e.type=='checkbox')e.checked=!!c.cfg[k];else e.value=c.cfg[k]}$('#st').innerHTML=rows(c.status)});fetch('/stats.json').then(j).then(function(d){$('#mt').innerHTML=rows(d.metrics||{})})}$('#f').onsubmit=function(e){e.preventDefault();fetch('/save',{method:'POST',body:new URLSearchParams(new FormData($('#f')))}).then(function(){$('#f').pass.value='';note('Instellingen opgeslagen.');cfg()})};$('#tst').onclick=function(){post('/test',{}).then(function(r){note(r.ok?'Statistieken verstuurd.':'Versturen mislukt.');cfg()})};cfg();chans();msgs();setInterval(function(){if(tabn==1)msgs()},3000);setInterval(function(){if(tabn==4)cfg()},10000);</script></main></body></html>
