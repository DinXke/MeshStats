<!doctype html><html lang=nl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>MeshCore node</title><style>
*{box-sizing:border-box}
h1,#sub,#ht,#hm,.cn,.sn{overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap}
body{margin:0;
  overflow:hidden;
  background:#0b0f14;
  color:#d7e2ea;
  font:15px/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
#ap{display:flex;
  height:100vh;
  height:100dvh}
aside{flex:0 0 15rem;
  width:15rem;
  background:#0e141c;
  display:flex;
  flex-direction:column;
  min-height:0}
#lb{border-right:1px solid #1e2b3a}
#rb{border-left:1px solid #1e2b3a;
  display:block;
  overflow-y:auto;
  padding-bottom:1rem}
#mn{flex:1;
  min-width:0;
  display:flex;
  flex-direction:column}
.scr{overflow-y:auto}
h1{font-size:1rem;
  margin:0}
h2,h3{text-transform:uppercase;
  letter-spacing:.17em;
  color:#35e08c;
  font-weight:600}
h2{font-size:.8rem;
  margin:1.4rem 0 .6rem}
h3{font-size:.7rem;
  margin:.9rem 0 .25rem;
  padding:0 .7rem}
.card{background:#121a23;
  border:1px solid #1e2b3a;
  border-radius:10px;
  padding:1rem}
label{display:block;
  margin-bottom:.8rem}
input,select{width:100%;
  margin-top:.25rem;
  padding:.45rem .7rem;
  border-radius:7px;
  border:1px solid #1e2b3a;
  background:#10161e;
  color:#d7e2ea}
button{padding:.45rem .9rem;
  border:none;
  border-radius:7px;
  background:#1d7a4f;
  color:#eafff4;
  cursor:pointer}
button:hover{background:#35e08c;
  color:#06130c}
table{width:100%;
  border-collapse:collapse}
td{padding:.35rem .5rem;
  border-bottom:1px solid #1e2b3a;
  font-family:ui-monospace,monospace;
  font-size:.9rem}
td:first-child{color:#7d8fa0}
.muted{color:#7d8fa0;
  font-size:.85rem}
.row{display:flex;
  gap:.6rem}
.row label{flex:1}
.ck{width:auto;
  margin-right:.4rem}
.pd{padding:.2rem .7rem;
  margin:0}
.inl{display:flex;
  align-items:center;
  margin:0 0 .5rem;
  font-size:.85rem}
.inl input{width:auto;
  margin:0 .35rem 0 0}
#lh{padding:.7rem;
  border-bottom:1px solid #1e2b3a}
#sub{margin:.2rem 0 .5rem;
  font-size:.75rem}
#cvl{flex:1}
#lf{border-top:1px solid #1e2b3a;
  padding:.6rem .7rem}
#lf .row button{flex:1;
  font-size:.85rem}
#bset{background:#121a23;
  color:#7d8fa0;
  border:1px solid #1e2b3a}
#cf{margin-top:.6rem}
.cv{display:flex;
  align-items:center;
  gap:.4rem;
  padding:.25rem .7rem;
  color:#a8b8c6;
  cursor:pointer}
.cv:hover{background:#16202b}
.cv.on{background:#1d7a4f;
  color:#eafff4}
.cn{flex:1}
.ub{background:#35e08c;
  color:#06130c;
  border-radius:9px;
  padding:0 .4rem;
  font-size:.72rem}
#hd{display:flex;
  align-items:center;
  gap:.5rem;
  padding:.5rem .8rem;
  background:#121a23;
  border-bottom:1px solid #1e2b3a}
#hd div{flex:1;
  min-width:0}
#ht,#hm{display:block}
#hm{font-size:.75rem}
.ic{display:none;
  background:none;
  color:#7d8fa0;
  font-size:1.1rem;
  padding:.1rem .4rem}
#ml{flex:1;
  padding:.7rem 0}
.m{display:grid;
  grid-template-columns:2.9rem 7rem 1fr;
  gap:.55rem;
  padding:.05rem .8rem;
  font-size:.92rem}
.m:hover{background:#10161e}
.me{background:#0f1a15;
  box-shadow:inset 2px 0 #1d7a4f}
.g{margin-top:.45rem}
.mt{font-family:ui-monospace,monospace;
  font-size:.72rem;
  color:#4c5c6b;
  text-align:right;
  padding-top:.2rem}
.sn{font-weight:600;
  text-align:right}
.tx{min-width:0;
  white-space:pre-wrap;
  word-break:break-word}
#sf{display:flex;
  gap:.5rem;
  padding:.6rem .8rem;
  background:#121a23;
  border-top:1px solid #1e2b3a}
#sf input{flex:1;
  margin:0}
#s4{flex:1;
  max-width:42rem;
  padding:0 1rem 2rem}
#rb td{word-break:break-all}
.pd input{margin-bottom:.5rem}
#sc{display:none;
  position:fixed;
  inset:0;
  z-index:8;
  background:#0009}
@media(max-width:960px){
  #rb{position:fixed;
    top:0;
    right:0;
    bottom:0;
    z-index:9;
    transform:translateX(101%);
    transition:transform .18s}
  body.ro #rb{transform:none}
  body.ro #sc{display:block}
  #br{display:block}
}
@media(max-width:680px){
  #lb{position:fixed;
    top:0;
    left:0;
    bottom:0;
    z-index:9;
    transform:translateX(-101%);
    transition:transform .18s}
  body.lo #lb{transform:none}
  body.lo #sc{display:block}
  #bl{display:block}
  .m{grid-template-columns:2.5rem 4.2rem 1fr;
    gap:.35rem;
    padding:.05rem .45rem}
}
</style></head><body>
<div id=ap>
<aside id=lb>
<div id=lh><h1 id=nm>&#128225; MeshCore node</h1><p class=muted id=sub>laden...</p><input id=fl placeholder=Filter autocomplete=off></div>
<div id=cvl class=scr><p class="muted pd">laden...</p></div>
<div id=lf><div class=row><button id=bnew type=button>+ Kanaal</button><button id=bset type=button>Instellingen</button></div>
<form id=cf hidden><label>Naam<input id=cn maxlength=31 required></label><label>PSK (base64)<input id=cp placeholder='leeg = nieuw kanaal'></label><button type=submit>Toevoegen</button></form>
</div>
</aside>
<main id=mn>
<header id=hd><button id=bl class=ic>&#9776;</button><div><b id=ht>Berichten</b><span class=muted id=hm></span></div><button id=br class=ic>&#8942;</button></header>
<div id=ml class=scr></div>
<div id=s4 class=scr hidden>
<h2>Doorsturen via MQTT</h2>
<div class=card>
<form id=f><div class=row><label>Broker<input name=host placeholder='10.0.0.5'></label><label>Poort<input name=port type=number></label></div><div class=row><label>Gebruiker<input name=user></label><label>Wachtwoord<input name=pass type=password placeholder='ongewijzigd'></label></div><div class=row><label>Topicprefix<input name=prefix></label><label>Interval (s)<input name=interval type=number></label></div><label><input class=ck type=checkbox name=enabled>Doorsturen ingeschakeld</label><label><input class=ck type=checkbox name=forward_rx>Ook elk ontvangen pakket doorsturen</label><button type=submit>Opslaan</button> <button type=button id=tst>Nu versturen</button>
</form><table id=st></table></div>
<h2>Live statistieken</h2>
<div class=card><table id=mt><tr><td>laden...</td></tr></table></div>
</div>
<p class="muted pd" id=note></p>
<form id=sf><input id=stx maxlength=150 autocomplete=off disabled><button type=submit>Verstuur</button></form>
</main>
<aside id=rb></aside>
</div>
<div id=sc></div>
<script>
// Gesprekken bestaan alleen hier; zie "De webclient" in StatsPublisher.h.
var $=function(s){return document.querySelector(s)};
var TY={0:'onbekend',1:'chat',2:'repeater',3:'room',4:'sensor'};
var NK=['#35e08c','#4fa8ff','#e0b657','#e08aa8','#9d8cff'];
var P='<p class="muted pd">',KG='Kies een gesprek',UC='onbekend contact';
var CH=[],CT=[],MS=[],SEEN={},CNT={},cur='',me='ik',seq=0,view=1,flt='',ctry=0;
function j(r){return r.json()}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}function post(u,d){return fetch(u,{method:'POST',body:new URLSearchParams(d)}).then(j)}function note(t){$('#note').textContent=t||''}function rows(o){var h='';for(var k in o){h+='<tr><td>'+k+'</td><td>'+esc(o[k])+'</td></tr>'}return h}function tm(t){if(!t)return'--:--';var d=new Date(t*1000);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}function ago(a){if(a<0)return'nooit gehoord';if(a<60)return a+'s geleden';if(a<3600)return Math.floor(a/60)+'m geleden';if(a<86400)return Math.floor(a/3600)+'u geleden';return Math.floor(a/86400)+'d geleden'}function nk(n){for(var h=0,i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&255;return NK[h%NK.length]}
// De ring van de node kapt namen af op 15 tekens, /contacts.json niet.
function eq(a,b){return a.slice(0,15)==b.slice(0,15)}
function ck(m){var i;if(m.k!=1)for(i=0;i<CH.length;i++)if(eq(CH[i].n,m.s))return'c'+CH[i].i;if(m.k!=0)for(i=0;i<CT.length;i++)if(eq(CT[i].n,m.s))return'k'+CT[i].k;return''}
function ctc(k){for(var i=0;i<CT.length;i++)if('k'+CT[i].k==k)return CT[i];return null}
function nam(k){var i;if(k[0]=='c'){for(i=0;i<CH.length;i++)if('c'+CH[i].i==k)return'#'+CH[i].n}var c=ctc(k);return c?'@'+c.n:k}
function it(k,l){var u=CNT[k];return'<div class="cv'+(k==cur?' on':'')+'" data-k='+k+'><span class=cn>'+esc(l)+'</span>'+(u?'<b class=ub>'+u+'</b>':'')+'</div>'}
function lst(){CNT={};MS.forEach(function(m){var k=m.c||(m.c=ck(m));if(k&&k!=cur&&m.q>(SEEN[k]||0))CNT[k]=(CNT[k]||0)+1});
var f=flt.toLowerCase(),h='<h3>Kanalen</h3>',n=0;
CH.forEach(function(c){if(f&&c.n.toLowerCase().indexOf(f)<0)return;h+=it('c'+c.i,'#'+c.n);n++});if(!n)h+=P+'geen kanalen</p>';
h+='<h3>Contacten</h3>';n=0;
CT.forEach(function(c){if(f&&c.n.toLowerCase().indexOf(f)<0)return;h+=it('k'+c.k,'@'+c.n);n++});if(!n)h+=P+'geen contacten</p>';
$('#cvl').innerHTML=h}
function draw(){var e=$('#ml'),b=e.scrollHeight-e.scrollTop-e.clientHeight<60,h='',ls='';
MS.forEach(function(m){if((m.c||(m.c=ck(m)))!=cur)return;var w=m.o?me:(m.w||'?');
h+='<div class="m'+(m.o?' me':'')+(w==ls?'':' g')+'"><span class=mt>'+tm(m.t)+'</span><span class=sn'+(w==ls?'></span>':' style=color:'+nk(w)+'>'+esc(w)+'</span>')+'<span class=tx>'+esc(m.x)+'</span></div>';
ls=w;if(m.q>(SEEN[cur]||0))SEEN[cur]=m.q});
e.innerHTML=h||P+'nog geen berichten</p>';if(b)e.scrollTop=e.scrollHeight}
function rside(){var h='',c=ctc(cur),i;
if(!cur){h=P+KG+'.</p>'}
else if(cur[0]=='c'){var sp={},n=0;MS.forEach(function(m){if(m.c==cur)sp[m.o?me:m.w||'?']=1});
h='<h3>In dit kanaal</h3>';for(i in sp){h+='<div class=cv><span class=cn style=color:'+nk(i)+'>'+esc(i)+'</span></div>';n++}
if(!n)h+=P+'nog niemand</p>';
h+='<h3>Contacten</h3>';CT.forEach(function(c){if(c.t==1)h+=it('k'+c.k,'@'+c.n)});
h+='<h3>Kanaal</h3><div class=pd><button id=cdel type=button>Kanaal verlaten</button></div>'}
else if(!c){h=P+UC+'</p>'}
else{h='<h3>Contact</h3><div class=pd><table><tr><td>Naam</td><td>'+esc(c.n)+'</td></tr><tr><td>Soort</td><td>'+TY[c.t]+'</td></tr><tr><td>Sleutel</td><td>'+c.k+'</td></tr><tr><td>Gehoord</td><td>'+ago(c.a)+'</td></tr></table></div>';
if(c.t==2||c.t==3)h+='<h3>Repeater</h3><div class=pd><label class=inl><input type=checkbox id=pb'+(c.p?' checked':'')+'>doorsturen naar site</label><input type=password id=pw placeholder="'+(c.w?'ongewijzigd':'wachtwoord')+'"><div class=row><button id=sv type=button>Bewaren</button><button id=li type=button>Inloggen</button></div></div>'}
$('#rb').innerHTML=h}
function vw(){var s=view==4;$('#s4').hidden=!s;$('#ml').hidden=s;$('#sf').hidden=s;$('#rb').hidden=$('#br').hidden=s;note('');
if(s){$('#ht').textContent='Instellingen';$('#hm').textContent='';cfg()}}
function sel(k){cur=k||'';view=1;vw();
var c=ctc(cur),t=$('#stx');
$('#ht').textContent=cur?nam(cur):'Berichten';
$('#hm').textContent=!cur?KG:(cur[0]=='c'?'kanaal · plaats '+cur.slice(1):(c?TY[c.t]+' · '+c.k+' · '+ago(c.a):UC));
t.disabled=!cur;t.placeholder=cur?'Bericht aan '+nam(cur):KG;
draw();lst();rside()}
function msgs(){return fetch('/messages.json?since='+seq).then(j).then(function(d){var n=0;
(d.m||[]).forEach(function(m){if(m.q>seq)seq=m.q;
// In een kanaal is "s" de kanaalnaam; wie sprak staat alleen voor de tekst.
if(m.k==0){var p=m.x.indexOf(': ');if(p>0&&p<33){m.w=m.x.slice(0,p);m.x=m.x.slice(p+2)}else m.w=m.s}
else if(m.k==2)m.o=1;else m.w=m.s;
MS.push(m);n++;
// Onbekende naam: contact van na het laden. Hoogstens elke halve minuut.
if(CT.length&&!ck(m)&&Date.now()-ctry>30000){ctry=Date.now();ctcs()}});
while(MS.length>120)MS.shift();
if(d.more)return msgs();
if(n){lst();if(view==1)draw()}})}
// Aaneengeschakeld ophalen: nooit twee verzoeken tegelijk naar de node.
function chans(off,acc){off=off||0;acc=acc||[];return fetch('/channels.json?off='+off).then(j).then(function(d){acc=acc.concat(d.ch||[]);if(d.next>=0)return chans(d.next,acc);CH=acc;
if(!cur&&CH.length)sel('c'+CH[0].i);else{lst();if(cur)rside()}})}
function ctcs(off,acc){off=off||0;acc=acc||[];return fetch('/contacts.json?off='+off).then(j).then(function(d){acc=acc.concat(d.c||[]);if(d.next>=0&&acc.length<200)return ctcs(d.next,acc);CT=acc;if(view==1)sel(cur);else lst()})}
function cfg(){fetch('/config.json').then(j).then(function(c){me=c.name||'ik';$('#nm').innerHTML='&#128225; '+esc(c.name);$('#sub').textContent='IP '+c.ip+' · id '+c.node;
var f=$('#f');for(var k in c.cfg){var e=f[k];if(!e)continue;if(e.type=='checkbox')e.checked=!!c.cfg[k];else e.value=c.cfg[k]}$('#st').innerHTML=rows(c.status)});
fetch('/stats.json').then(j).then(function(d){$('#mt').innerHTML=rows(d.metrics||{})})}
// Kiezen sluit de lade: op een telefoon ligt die over het gesprek heen.
$('#ap').onclick=function(e){var d=e.target.closest('.cv');if(d&&d.dataset.k){sel(d.dataset.k);document.body.className='';return}
var b=e.target.closest('button');if(!b)return;
if(b.id=='cdel'){post('/channel/del',{idx:cur.slice(1)}).then(function(r){note(r.ok?'Kanaal verlaten.':(r.err||'Verwijderen mislukt.'));sel('');chans()});return}
var c=ctc(cur);if(!c)return;
if(b.id=='sv')post('/contact/save',{key:c.k,publish:$('#pb').checked?1:0,pass:$('#pw').value}).then(function(r){note(r.ok?'Bewaard.':(r.err||'Bewaren mislukt.'));if(r.ok)ctcs()});
if(b.id=='li')post('/contact/login',{key:c.k}).then(function(r){note(r.ok?'Inlogverzoek verstuurd.':(r.err||'Inloggen mislukt.'))})};
$('#sf').onsubmit=function(e){e.preventDefault();var t=$('#stx').value;if(!t||!cur)return;post('/send',{to:cur,text:t}).then(function(r){if(r.ok){$('#stx').value='';note('');msgs()}else note(r.err||'Versturen mislukt.')})};
$('#cf').onsubmit=function(e){e.preventDefault();post('/channel/add',{name:$('#cn').value,psk:$('#cp').value}).then(function(r){note(r.ok?'Kanaal toegevoegd.':(r.err||'Toevoegen mislukt.'));if(r.ok){$('#cn').value='';$('#cp').value='';$('#cf').hidden=1}chans()})};
$('#f').onsubmit=function(e){e.preventDefault();fetch('/save',{method:'POST',body:new URLSearchParams(new FormData($('#f')))}).then(function(){$('#f').pass.value='';note('Instellingen opgeslagen.');cfg()})};
$('#tst').onclick=function(){post('/test',{}).then(function(r){note(r.ok?'Statistieken verstuurd.':'Versturen mislukt.');cfg()})};
$('#fl').oninput=function(){flt=this.value;lst()};
$('#bnew').onclick=function(){$('#cf').hidden=!$('#cf').hidden};
$('#bset').onclick=function(){view=4;vw();document.body.className=''};
$('#bl').onclick=function(){document.body.classList.toggle('lo')};
$('#br').onclick=function(){document.body.classList.toggle('ro')};
$('#sc').onclick=function(){document.body.className=''};
cfg();chans().then(ctcs);msgs();sel('');
setInterval(function(){if(view==1)msgs()},3000);setInterval(function(){if(view==4)cfg()},10000);
</script></body></html>
