; ---------------------------------------------------------------------------
; MeshTrack — PlatformIO overlay-env voor de Seeed T1000-E.
;
; Basis: stock MeshCore v1.17.1 (commit d929643), env t1000e_companion_radio_ble.
; Build-flags en geheugenindeling (extrafs-ldscript, MAX_CONTACTS, channels,
; offline-queue) zijn BEWUST identiek aan stock: dan behoudt een app-only flash
; identiteit, prefs, contacten en kanalen.
;
; Eigen kopieën (met MeshTrack-hooks) vervangen stock-bestanden: MyMesh.cpp/.h
; (ACK + batterij voor de app), MtTarget.cpp (= variants/t1000-e/target.cpp met
; een GPS-provider die ook snelheid, koers en HDOP geeft), main.cpp en UITask.
;
; Gebruik: deze sectie in <MeshCore>/platformio.local.ini zetten, met de
; mappen naast elkaar:  <parent>/MeshCore-std  en  <parent>/meshtrack
;   PLATFORMIO_CORE_DIR=C:/.platformio python -m platformio run -e t1000e_meshtrack
; Bouwen op een ASCII-pad.
; ---------------------------------------------------------------------------

[env:t1000e_meshtrack]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I ../meshtrack/firmware/meshtrack
  -I examples/companion_radio
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
  -<../variants/t1000-e/target.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../../meshtrack/firmware/meshtrack/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0
