; ---------------------------------------------------------------------------
; MeshUptimeCompanion — PlatformIO overlay env for the Seeed T1000-E.
;
; OVERLAY PATTERN (mirrors MeshStats/docs/firmware.md): this file adds ONE env
; on top of an unmodified MeshCore checkout. Nothing in MeshCore is edited.
;
; To build:
;   1. Check out MeshCore on branch iotthinks/PowerSaving-v17 (v1.17.1, has RXPS
;      + the T1000-E power profile). A git worktree is the non-destructive way:
;         git worktree add --detach ../MeshCore-ps17 iotthinks/PowerSaving-v17
;   2. Copy THIS file to the MeshCore checkout root as `platformio.local.ini`
;      (MeshCore's root platformio.ini already pulls it in via `extra_configs`).
;   3. Make sure this repo (MU-companion) sits next to the MeshCore checkout, i.e.
;         <parent>/MeshCore-ps17     (or MeshCore)
;         <parent>/MU-companion/MeshUptimeCompanion
;      The relative paths below assume that sibling layout.
;   4. python -m platformio run -e t1000e_meshuptime_companion
;
; Paths: build_src_filter globs are relative to <MeshCore>/src, so `../../` is
; the parent that holds both checkouts. `-I` flags are relative to <MeshCore>.
; ---------------------------------------------------------------------------

[env:t1000e_meshuptime_companion]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio
  -I ../MU-companion/MeshUptimeCompanion
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1     ; pairing/disconnect-redenen over serieel; zie SerialBLEInterface.h
  -D BLE_TX_POWER=0
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37        ; P1.5 — required for T1000-E buzzer
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400   ; graceful low-batt (matches heltec_v3); drives our warning
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../../MU-companion/MeshUptimeCompanion/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:t1000e_meshtrack]
extends = t1000-e
; pio_overlay_guard: de overlay-objecten staan buiten de env-map (gedeeld); bij een andere env wissen
extra_scripts = ${nrf52_base.extra_scripts}
  pre:../meshtrack/tools/pio_overlay_guard.py
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I ../meshtrack/firmware/meshtrack
  -I examples/companion_radio
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
  -<../variants/t1000-e/target.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../../meshtrack/firmware/meshtrack/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

; MeshTrack voor de RAK WisMesh Tag (0.9.7). Zelfde overlay als t1000e_meshtrack; het bord kiest via
; RAK_WISMESH_TAG (MtBoard.h). S140 v6 (sd_req 0xB6, app vanaf 0x26000), zoals de stock Tag-builds.
; Geen TX-led (zoals op de T1000-E); de knop is actief laag (pull-up uit RAKWismeshTagBoard::begin).
; ENV_SKIP_GPS_DETECT: de Tag heeft altijd een GPS; zonder dit verdwijnt de "gps"-instelling als de
; GPS bij het opstarten binnen 1 s nog niets stuurde.
[env:rak_wismesh_tag_meshtrack]
extends = rak_wismesh_tag
extra_scripts = ${nrf52_base.extra_scripts}
  pre:../meshtrack/tools/pio_overlay_guard.py
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags = -D P_LORA_TX_LED=LED_GREEN
build_flags = ${rak_wismesh_tag.build_flags}
  -I ../meshtrack/firmware/meshtrack
  -I examples/companion_radio
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
  -D OFFLINE_QUEUE_SIZE=256
  -D USER_BTN_PRESSED=LOW
  -D ENV_SKIP_GPS_DETECT=1
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${rak_wismesh_tag.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  -<../variants/rak_wismesh_tag/target.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../../meshtrack/firmware/meshtrack/*.cpp>
lib_deps = ${rak_wismesh_tag.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

; MeshTrack voor RAK19007 + RAK3401 + RAK13302 1W-versterker (0.9.7+, bord-id rak3401_1w). S140 v6.
; LORA_TX_POWER 18: de RAK13302 versterkt tot +9 dB (Meshtastic TX_GAIN_LORA), dus ≈ 27 dBm = 500 mW, de
; EU-grens in 869,4-869,65 MHz; MAX_LORA_TX_POWER volgt (app en CLI weigeren meer, oude prefs worden
; begrensd). Geen buzzer (leds), geen bewegingssensor (rust via GPS), GPS via draadjes (pinnen zoeken),
; optionele analoge knop P0.31 (instelling knop, standaard uit). DISPLAY_CLASS SSD1306 zoals stock:
; zonder scherm geeft begin() false.
[env:rak3401_meshtrack]
extends = rak3401
extra_scripts = ${nrf52_base.extra_scripts}
  pre:../meshtrack/tools/pio_overlay_guard.py
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags = -D LORA_TX_POWER=22
build_flags = ${rak3401.build_flags}
  -I ../meshtrack/firmware/meshtrack
  -I examples/companion_radio
  -I src/helpers/ui
  -D LORA_TX_POWER=18
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_USER_BTN_ANA=31
  -D USER_BTN_PRESSED=LOW
  -D ENV_SKIP_GPS_DETECT=1
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  -<../variants/rak3401/target.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../../meshtrack/firmware/meshtrack/*.cpp>
lib_deps = ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0
