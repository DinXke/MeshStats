<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeshTrack – geen verbinding</title>
<!-- Algemene pagina die de service worker toont als de server niet bereikbaar is.
     Bevat bewust geen gegevens van de gebruiker. -->
<script id="mt-early-theme">try{var t=JSON.parse(localStorage.getItem("mt.theme")||"\"auto\"");if(t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; margin: 0;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  .nc { max-width: 440px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; }
  .nc h1 { font-size: 20px; margin: 0 0 8px; }
  .nc p { line-height: 1.5; margin: 0 0 12px; }
  .nc .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .nc .acts a, .nc .acts button { display: block; text-align: center; padding: 11px 14px; border-radius: 8px; font-size: 15px; text-decoration: none; }
  .nc .acts a { border: 1px solid var(--line); background: var(--panel); color: var(--text); }
</style>
</head>
<body>
<main class="nc">
  <h1>Geen verbinding met de server</h1>
  <p>MeshTrack kan de server nu niet bereiken. Controleer je internetverbinding en probeer het opnieuw.</p>
  <p class="muted">De offline-kaart en Tracker live werken ook zonder verbinding, als je ze op dit toestel al eens geopend hebt.</p>
  <div class="acts">
    <button type="button" class="primary" id="nc-retry">Opnieuw proberen</button>
    <a href="/offline">Offline-kaart</a>
    <a href="/tracker">Tracker live</a>
  </div>
</main>
<script>
  document.getElementById("nc-retry").addEventListener("click", function () { location.reload(); });
  // Verbinding terug: eerst nagaan of de server echt antwoordt, dan pas opnieuw laden
  // (een los "online"-signaal mag een klik op een van de knoppen niet onderbreken).
  window.addEventListener("online", function () {
    fetch("/api/health", { cache: "no-store" }).then(function (r) { if (r.ok) location.reload(); }, function () {});
  });
</script>
</body>
</html>
