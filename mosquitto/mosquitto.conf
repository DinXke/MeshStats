# Mosquitto voor MeshStats: nodes publiceren hier hun statistieken naartoe.
listener 1883
protocol mqtt

# Geen anonieme toegang: nodes en de site melden zich met gebruiker/wachtwoord.
allow_anonymous false
password_file /mosquitto/config/passwd

# Wie mag wat publiceren. Zonder deze regel mag elk account naar elk topic
# schrijven, en dan zegt het topic wel welke node publiceert maar dwingt niets
# af. Het bestand wordt aangemaakt door init-passwd.sh en aangevuld door
# add-node-user.sh; zonder dat bestand start de broker niet.
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error

# Een node stuurt kleine JSON-berichten; ruim genoeg met marge.
message_size_limit 8192
max_keepalive 300
